name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to /new\n2. Paste ...\n3. ..."
    validations:
      required: true
  - type: input
    id: pack-key
    attributes:
      label: Pack key (if relevant)
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on macOS
